<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>サーナイト鳴き声</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
        }

        button {
            font-size: 20px;
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;

            /* グラデーションで立体感 */
            background: linear-gradient(145deg, #ffffff, #dcdcdc);

            /* 影で浮き上がり */
            box-shadow: 
                6px 6px 12px rgba(0,0,0,0.2),
                -4px -4px 8px rgba(255,255,255,0.7);

            /* 文字 */
            font-weight: bold;
            color: #333;

            transition: all 0.1s ease-in-out;
        }

        /* ホバー時（少し浮く） */
        button:hover {
            box-shadow: 
                8px 8px 16px rgba(0,0,0,0.25),
                -6px -6px 10px rgba(255,255,255,0.8);
        }

        /* 押したとき（沈む） */
        button:active {
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.2),
                inset -4px -4px 8px rgba(255,255,255,0.7);
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <button onclick="playSound()">サーナイトの鳴き声</button>

    <audio id="sound" src="http://games255.512.jp/pokewav/282.wav"></audio>

    <script>
        function playSound() {
            const audio = document.getElementById('sound');
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
